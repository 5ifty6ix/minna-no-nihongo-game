<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minna No Nihongo N5 Vocabulary Matching</title>
    <style>
:root {
    --bg-color: #f7f9fa;
    --text-color: #3c3c3c;
    --primary-color: #58cc02;
    --primary-shadow: #46a302;
    --secondary-color: #1cb0f6;
    --secondary-shadow: #1899d6;
    --danger-color: #ff4b4b;
    --danger-shadow: #ea2b2b;
    --tile-bg: #ffffff;
    --tile-border: #e5e5e5;
    --tile-shadow: #e5e5e5;
    --tile-hover-bg: #ddf4ff;
    --tile-hover-border: #84d8ff;
    --tile-selected-bg: #ddf4ff;
    --tile-selected-border: #1cb0f6;
    --tile-selected-text: #1cb0f6;
    --font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-family);
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.global-header {
    text-align: center;
    margin-bottom: 20px;
}

.main-title {
    font-size: 2.2rem;
    color: var(--primary-color);
    margin-bottom: 5px;
}

.sub-title {
    font-size: 1.2rem;
    color: #777;
    margin-bottom: 0;
    font-weight: normal;
}

#app {
    width: 100%;
    max-width: 600px;
    background: var(--tile-bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.screen {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
}

.screen.active {
    display: flex;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    font-size: 2rem;
    color: var(--primary-color);
    margin-bottom: 20px;
}

p {
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: #777;
}

/* Menu */
#lesson-selector {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    width: 100%;
    max-height: 50vh;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 20px;
    border: 2px solid var(--tile-border);
    border-radius: 16px;
    background: #fff;
}

.lesson-checkbox {
    display: flex;
    align-items: center;
    padding: 10px;
    border: 2px solid var(--tile-border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
}

.lesson-checkbox:hover {
    background: var(--tile-hover-bg);
}

.lesson-checkbox.selected {
    background: var(--tile-selected-bg);
    border-color: var(--tile-selected-border);
    color: var(--tile-selected-text);
    font-weight: bold;
}

.lesson-checkbox input {
    /* Visually hidden for accessibility to keep keyboard navigation intact */
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
}

.lesson-checkbox:has(input:focus-visible) {
    outline: 2px solid var(--primary-color);
    outline-offset: 2px;
}

/* Buttons */
button {
    font-family: var(--font-family);
    font-size: 1.2rem;
    font-weight: bold;
    padding: 12px 24px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.1s;
    width: 100%;
    max-width: 300px;
}

#start-btn, #play-again-btn {
    background-color: var(--primary-color);
    color: white;
    box-shadow: 0 4px 0 var(--primary-shadow);
}

#start-btn:active:not(:disabled), #play-again-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--primary-shadow);
}

#start-btn:disabled {
    background-color: #e5e5e5;
    color: #767676; /* Better contrast ratio */
    box-shadow: 0 4px 0 #cfcfcf;
    cursor: not-allowed;
}

#back-btn {
    background: none;
    color: #afafaf;
    border: 2px solid #e5e5e5;
    box-shadow: 0 2px 0 #e5e5e5;
    padding: 8px 16px;
    width: auto;
    font-size: 1rem;
}

#back-btn:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #e5e5e5;
}

/* Header */
.header {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    gap: 15px;
}

.progress-bar-container {
    flex-grow: 1;
    height: 16px;
    background: #e5e5e5;
    border-radius: 8px;
    overflow: hidden;
}

#progress-bar {
    height: 100%;
    background: var(--primary-color);
    width: 0%;
    transition: width 0.3s ease;
}

#score {
    font-weight: bold;
    color: var(--primary-color);
    font-size: 1.1rem;
    min-width: 60px;
    text-align: right;
}

/* Game Board */
#game-board {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    width: 100%;
}

.column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 50%;
}

.tile {
    background: var(--tile-bg);
    border: 2px solid var(--tile-border);
    border-bottom-width: 4px;
    border-radius: 16px;
    padding: 15px 10px;
    text-align: center;
    font-size: clamp(0.9rem, 2vw + 0.5rem, 1.2rem); /* Dynamic scaling */
    font-weight: bold;
    cursor: pointer;
    transition: all 0.1s, opacity 0.3s, transform 0.3s;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70px;
    word-break: break-word;
}

.tile:focus-visible {
    outline: 3px solid var(--primary-color);
    outline-offset: 2px;
}

.tile:active:not(.disabled) {
    transform: translateY(2px) scale(0.98);
    border-bottom-width: 2px;
}

.tile.selected {
    background: var(--tile-selected-bg);
    border-color: var(--tile-selected-border);
    color: var(--tile-selected-text);
}

.tile.matched {
    background: var(--primary-color);
    border-color: var(--primary-shadow);
    color: white;
    opacity: 0 !important;
    transform: scale(0.8) !important;
    pointer-events: none;
}

.tile.wrong {
    background: #ffdfe0;
    border-color: var(--danger-shadow);
    color: var(--danger-color);
    animation: shake 0.4s;
}

.tile.disabled {
    pointer-events: none;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
}

/* Stats */
.stats p {
    font-size: 1.3rem;
    font-weight: bold;
    color: #4b4b4b;
    margin-bottom: 10px;
}

.stats span {
    color: var(--primary-color);
}

/* Footer */
footer {
    margin-top: 30px;
    font-size: 0.95rem;
    color: #888;
    text-align: center;
}

/* Modal */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: white;
    padding: 24px;
    border-radius: 20px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.btn-cancel {
    background: white;
    color: var(--text-color);
    border: 2px solid var(--tile-border);
    box-shadow: 0 4px 0 var(--tile-shadow);
}

.btn-cancel:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--tile-shadow);
}

.btn-confirm {
    background: var(--danger-color);
    color: white;
    box-shadow: 0 4px 0 var(--danger-shadow);
}

.btn-confirm:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--danger-shadow);
}
    </style>
</head>
<body>
    <header class="global-header">
        <h1 class="main-title">みんなの日本語</h1>
        <h2 class="sub-title">Vocabulary Game</h2>
    </header>

    <div id="app">
        <!-- Menu Screen -->
        <div id="menu-screen" class="screen active">
            <p>Select lessons to practice:</p>
            <div id="lesson-selector">
                <!-- Checkboxes generated by JS -->
            </div>
            <button id="start-btn" disabled>Start Practice</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="header">
                <button id="back-btn">Back</button>
                <div class="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                <div id="score">0 / 0</div>
            </div>
            <div id="game-board">
                <div id="left-column" class="column"></div>
                <div id="right-column" class="column"></div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>Lesson Complete!</h2>
            <div class="stats">
                <p>Mistakes: <span id="mistake-count">0</span></p>
                <p>Time: <span id="time-taken">00:00</span></p>
            </div>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="quit-modal" class="modal-overlay">
        <div class="modal">
            <h3 style="margin-bottom: 10px; font-size: 1.5rem; color: var(--text-color);">Quit Session?</h3>
            <p>Are you sure you want to quit this session? Your progress will be lost.</p>
            <div class="modal-actions">
                <button id="modal-cancel-btn" class="btn-cancel">Cancel</button>
                <button id="modal-confirm-btn" class="btn-confirm">Quit</button>
            </div>
        </div>
    </div>

    <footer>Created by: Abdullah Gazi</footer>

document.addEventListener('DOMContentLoaded', () => {
    // Elements
    const screens = {
        menu: document.getElementById('menu-screen'),
        game: document.getElementById('game-screen'),
        result: document.getElementById('result-screen')
    };
    
    const lessonSelector = document.getElementById('lesson-selector');
    const startBtn = document.getElementById('start-btn');
    const backBtn = document.getElementById('back-btn');
    const playAgainBtn = document.getElementById('play-again-btn');
    const progressBar = document.getElementById('progress-bar');
    const scoreDisplay = document.getElementById('score');
    const mistakeCountDisplay = document.getElementById('mistake-count');
    const timeTakenDisplay = document.getElementById('time-taken');

    // Modal Elements
    const quitModal = document.getElementById('quit-modal');
    const modalCancelBtn = document.getElementById('modal-cancel-btn');
    const modalConfirmBtn = document.getElementById('modal-confirm-btn');

    // State
    let selectedLessons = new Set();
    let currentVocabPool = [];
    let totalPairs = 0;
    let matchedPairs = 0;
    let mistakes = 0;
    let selectedTile = null;
    let startTime = 0;
    let poolIndex = 0;
    const BATCH_SIZE = 7;
    const VANISH_DELAY_MS = 300;
    const WRONG_DELAY_MS = 500;

    // Initialization
    initMenu();

    function initMenu() {
        lessonSelector.innerHTML = '';
        
        // Count available lessons from vocabData
        const availableLessons = Object.keys(vocabData).map(Number).sort((a,b) => a-b);
        
        availableLessons.forEach(lessonNum => {
            const label = document.createElement('label');
            label.className = 'lesson-checkbox';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = lessonNum;
            
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) {
                    selectedLessons.add(lessonNum);
                    label.classList.add('selected');
                } else {
                    selectedLessons.delete(lessonNum);
                    label.classList.remove('selected');
                }
                startBtn.disabled = selectedLessons.size === 0;
            });
            
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(`Lesson ${lessonNum}`));
            lessonSelector.appendChild(label);
        });
    }

    function showScreen(screenName) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[screenName].classList.add('active');
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startGame() {
        currentVocabPool = [];
        selectedLessons.forEach(lessonNum => {
            if (vocabData[lessonNum]) {
                // Sanitize the raw text to eliminate hidden newline characters
                vocabData[lessonNum].forEach(item => {
                    currentVocabPool.push({
                        ja: item.ja.trim(),
                        en: item.en.trim()
                    });
                });
            }
        });
        
        // Remove duplicates if any safely using a delimiter
        const uniqueSet = new Set();
        currentVocabPool = currentVocabPool.filter(item => {
            const key = item.ja + '|' + item.en;
            if (uniqueSet.has(key)) return false;
            uniqueSet.add(key);
            return true;
        });

        shuffleArray(currentVocabPool);
        
        totalPairs = currentVocabPool.length;
        matchedPairs = 0;
        mistakes = 0;
        poolIndex = 0;
        startTime = Date.now();
        
        updateProgress();
        initBoard();
        showScreen('game');
    }

    function initBoard() {
        const leftCol = document.getElementById('left-column');
        const rightCol = document.getElementById('right-column');
        leftCol.innerHTML = '';
        rightCol.innerHTML = '';
        selectedTile = null;

        // Fill initial batch
        for(let i = 0; i < BATCH_SIZE && poolIndex < totalPairs; i++) {
            addPairToBoard();
        }
        
        shuffleColumn(leftCol);
        shuffleColumn(rightCol);
    }

    function addPairToBoard() {
        if (poolIndex >= totalPairs) return;
        
        const pair = currentVocabPool[poolIndex];
        const pairId = poolIndex;
        poolIndex++;
        
        const leftCol = document.getElementById('left-column');
        const rightCol = document.getElementById('right-column');

        const jaTile = createTile(pair.ja, 'ja', pairId);
        const enTile = createTile(pair.en, 'en', pairId);

        insertRandomly(leftCol, jaTile);
        insertRandomly(rightCol, enTile);
    }

    function insertRandomly(container, element) {
        const children = container.children;
        if (children.length === 0) {
            container.appendChild(element);
        } else {
            const randomIndex = Math.floor(Math.random() * (children.length + 1));
            if (randomIndex === children.length) {
                container.appendChild(element);
            } else {
                container.insertBefore(element, children[randomIndex]);
            }
        }
        
        // Fade in animation
        element.style.opacity = '0';
        element.style.transform = 'scale(0.8)';
        setTimeout(() => {
            element.style.opacity = '1';
            element.style.transform = 'scale(1)';
        }, 10);
    }

    function shuffleColumn(container) {
        const elements = Array.from(container.children);
        shuffleArray(elements);
        elements.forEach(el => container.appendChild(el));
    }

    function createTile(text, type, id) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = text;
        tile.dataset.type = type;
        tile.dataset.id = id;
        
        // Accessibility attributes for keyboard navigation
        tile.tabIndex = 0;
        tile.setAttribute('role', 'button');
        
        tile.addEventListener('click', () => handleTileClick(tile));
        
        // Listen for keyboard input
        tile.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault(); // Prevent page scroll on space
                handleTileClick(tile);
            }
        });
        
        return tile;
    }

    function handleTileClick(tile) {
        if (tile.classList.contains('matched') || tile.classList.contains('disabled') || tile === selectedTile) {
            if (tile === selectedTile) {
                // Deselect
                tile.classList.remove('selected');
                selectedTile = null;
            }
            return;
        }

        // First selection
        if (!selectedTile) {
            tile.classList.add('selected');
            selectedTile = tile;
            return;
        }

        const firstTile = selectedTile;
        const secondTile = tile;
        
        // Prevent selecting two from the same side
        if (firstTile.dataset.type === secondTile.dataset.type) {
            firstTile.classList.remove('selected');
            secondTile.classList.add('selected');
            selectedTile = secondTile;
            return;
        }

        firstTile.classList.remove('selected');
        selectedTile = null;

        // Prevent clicking other tiles while animating
        const allTiles = document.querySelectorAll('.tile');
        allTiles.forEach(t => t.classList.add('disabled'));

        if (firstTile.dataset.id === secondTile.dataset.id) {
            // Match
            firstTile.classList.add('matched');
            secondTile.classList.add('matched');
            matchedPairs++;
            updateProgress();
            
            setTimeout(() => {
                firstTile.remove();
                secondTile.remove();

                const remainingTiles = document.querySelectorAll('.tile');
                remainingTiles.forEach(t => {
                    t.classList.remove('disabled');
                });
                
                if (matchedPairs >= totalPairs) {
                    endGame();
                } else if (remainingTiles.length === 0) {
                    initBoard();
                }
            }, VANISH_DELAY_MS); 
            
        } else {
            // Mismatch
            mistakes++;
            firstTile.classList.add('wrong');
            secondTile.classList.add('wrong');
            
            setTimeout(() => {
                firstTile.classList.remove('wrong');
                secondTile.classList.remove('wrong');
                allTiles.forEach(t => {
                    if (!t.classList.contains('matched')) t.classList.remove('disabled');
                });
            }, WRONG_DELAY_MS);
        }
    }

    function updateProgress() {
        const percentage = (matchedPairs / totalPairs) * 100;
        progressBar.style.width = `${percentage}%`;
        scoreDisplay.textContent = `${matchedPairs} / ${totalPairs}`;
    }

    function endGame() {
        const timeTakenMs = Date.now() - startTime;
        const minutes = Math.floor(timeTakenMs / 60000);
        const seconds = Math.floor((timeTakenMs % 60000) / 1000);
        
        mistakeCountDisplay.textContent = mistakes;
        timeTakenDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        showScreen('result');
    }

    // Event Listeners
    startBtn.addEventListener('click', startGame);
    
    backBtn.addEventListener('click', () => {
        // Show the custom modal instead of blocking alert
        quitModal.classList.add('active');
    });

    modalCancelBtn.addEventListener('click', () => {
        quitModal.classList.remove('active');
    });

    modalConfirmBtn.addEventListener('click', () => {
        quitModal.classList.remove('active');
        showScreen('menu');
    });
    
    playAgainBtn.addEventListener('click', () => {
        showScreen('menu');
    });
});
    </script>
</body>
</html>
